name: OSV-Scanner

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # PR delta scan — uploads SARIF to Code Scanning (must run on pull_request).
  osv-scan:
    name: OSV-Scanner PR
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # main (export-results=false)
    with:
      export-results: false
      # Do not resolve transitive dependencies: requirements*.txt use open-ended
      # ">=" ranges, and the pip-style resolution runs for ~50 minutes and then
      # aborts ("too many iterations"), failing the job. Only the packages
      # listed in the files are scanned.
      scan-args: |-
        --no-resolve
        -r
        ./

  # Full scan on main / weekly — logs + fail-on-vuln; no SARIF upload (avoids a
  # second Code Scanning config that PRs cannot satisfy).
  osv-scan-scheduled:
    name: OSV-Scanner Scheduled
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # main (export-results=false)
    with:
      upload-sarif: false
      export-results: false
      # Do not resolve transitive dependencies: requirements*.txt use open-ended
      # ">=" ranges, and the pip-style resolution runs for ~50 minutes and then
      # aborts ("too many iterations"), failing the job. Only the packages
      # listed in the files are scanned.
      scan-args: |-
        --no-resolve
        -r
        ./
