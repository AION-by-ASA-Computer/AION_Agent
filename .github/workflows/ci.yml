name: AION CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Cancel redundant runs on the same PR branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Linting and Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Configure Environment and Sync MCP/Config
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run python scripts/setup_core.py --non-interactive --skip-promo-playwright

      - name: Setup and upgrade script smoke (dry-run)
        run: |
          chmod +x scripts/setup-aion-env.sh scripts/upgrade-aion.sh
          uv run python scripts/setup_core.py --non-interactive --dry-run --skip-promo-playwright
          uv run python scripts/upgrade_core.py --dry-run --skip-backup --skip-promo-playwright
          ./scripts/setup-aion-env.sh --dry-run
          ./scripts/upgrade-aion.sh --dry-run

      - name: Lint (Ruff)
        run: |
          uv pip install 'ruff==0.16.0'
          uv run ruff check --config ruff.toml src/
          uv run ruff format --check --config ruff.toml src/

      - name: Check no runtime data/ tracked in git
        run: uv run python scripts/check_data_git_tracking.py

      - name: Check no proprietary skills in config_std
        run: uv run python scripts/check_config_std_no_proprietary_skills.py

      - name: Run CI pytest suite
        env:
          AION_CHAT_PASSWORD_AUTH: "0"
          AION_ADMIN_PASSWORD_AUTH: "0"
          AION_REDIS_FALLBACK_LOCAL: "1"
        run: |
          uv pip install pytest pytest-asyncio
          chmod +x scripts/run_ci_tests.sh
          ./scripts/run_ci_tests.sh

  frontend-checks:
    name: Frontend Packages Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('chat-ui/package.json', 'admin-ui/package.json', 'website/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install and build Chat UI
        run: |
          cd chat-ui
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Build Admin UI
        run: |
          cd admin-ui
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Build Website (Docusaurus)
        run: |
          cd website
          pnpm install --no-frozen-lockfile
          pnpm build

  security-scan:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run Trivy filesystem scan
        # Pin SHA (v0.35.0) — do not use mutable version tags (supply-chain risk).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  # One job per image, run in parallel: wall time is the slowest image instead
  # of the sum of all six. Each image has its own GHA cache scope; with the
  # default shared scope the builds overwrote each other's cache (mode=max).
  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/Dockerfile.backend
          - image: chat-ui
            dockerfile: docker/Dockerfile.chat-ui
          - image: admin-ui
            dockerfile: docker/Dockerfile.admin-ui
          - image: website
            dockerfile: docker/Dockerfile.website
          - image: sandbox
            dockerfile: docker/Dockerfile.sandbox
          - image: updater
            dockerfile: docker/Dockerfile.updater
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Kept for every image (takes <20s): the Dockerfiles build from the
      # repository files this step generates.
      - name: Sync config before image build
        run: |
          uv venv .venv-ci
          source .venv-ci/bin/activate
          uv pip install -r requirements.txt
          uv run python scripts/setup_core.py --non-interactive --skip-promo-playwright

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: aion-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Aggregator keeping the required status check name "Test Docker Builds"
  # (see .github/BRANCH_PROTECTION.md): branch protection cannot reference the
  # per-image matrix jobs, and a skipped/failed matrix must fail this check.
  docker-build-checks:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker-build
    if: ${{ always() }}
    steps:
      - name: Require all image builds to succeed
        env:
          BUILD_RESULT: ${{ needs.docker-build.result }}
        run: |
          echo "docker-build matrix result: ${BUILD_RESULT}"
          [ "${BUILD_RESULT}" = "success" ]
