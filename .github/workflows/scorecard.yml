name: OpenSSF Scorecard

on:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # Pinned to v2.4.3: v2.4.4 (Scorecard v5.5.0) hangs in the Vulnerabilities check,
        # which runs OSV-Scanner with PyPI transitive resolution on every requirements
        # file without hashes (same cause as our slow OSV job). See ossf/scorecard#5234.
        # Revisit when a newer release is confirmed fixed.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
