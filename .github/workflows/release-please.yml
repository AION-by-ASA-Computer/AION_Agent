name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # PAT required: GITHUB_TOKEN releases do not trigger release-images.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  openapi-asset:
    name: Attach openapi.json
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Export and upload openapi.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run python scripts/export_openapi.py --full openapi.json
          gh release upload "$TAG" openapi.json --clobber

  # Signed-Releases (OpenSSF Scorecard): attach a keyless cosign signature to the release.
  # Scorecard looks for release assets ending in .sig/.asc/.sigstore/.sigstore.json; the
  # bundle holds the signature + Fulcio certificate + Rekor entry, tied to this workflow's
  # OIDC identity, so consumers can verify with `cosign verify-blob` (no long-lived keys).
  sign-release:
    name: Sign release source archive
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the signed assets to the release
      id-token: write   # OIDC token for Sigstore keyless signing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: false
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build source archive, sign it and upload both
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # Deterministic archive of the tagged tree (git archive output is reproducible).
          ARCHIVE="aion-agent-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="aion-agent-${TAG}/" -o "$ARCHIVE" "$TAG"
          # Keyless signing; --bundle writes signature + certificate + transparency proof.
          cosign sign-blob --yes --bundle "${ARCHIVE}.sigstore.json" "$ARCHIVE"
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sigstore.json" --clobber
