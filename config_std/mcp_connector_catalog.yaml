  - id: microsoft_sharepoint
    title: Microsoft SharePoint
    category: knowledge
    install_type: remote
    remote_url: "https://agent365.svc.cloud.microsoft/agents/tenants/{tenant_id}/servers/mcp_SharePointRemoteServer"
    remote_url_template: true
    auth_type: oauth2
    oauth_provider: microsoft
    featured_remote: true
    default_credential_mode: per_user
    description: >
      MCP SharePoint via Microsoft Agent 365 / Work IQ (preview). Sostituire {tenant_id} con il GUID
      Entra ID. Richiede licenza M365 Copilot, consenso admin Work IQ e app Entra con client ID in Hub.
    tags: [microsoft, sharepoint, m365, oauth]
    mcp_name_hints: [sharepoint, microsoft_sharepoint]
    oauth:
      authorization_server: "https://login.microsoftonline.com/{tenant_id}"
      authorization_endpoint: "https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/authorize"
      token_url: "https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token"
      resource: "https://agent365.svc.cloud.microsoft/agents/tenants/{tenant_id}/servers/mcp_SharePointRemoteServer"
      client_credentials_required: true
      setup_doc_url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/mcp-sharepoint-work-iq
      admin_setup_hint: >
        Registra un'app in Microsoft Entra ID, aggiungi il redirect URI AION (sotto), concedi i permessi
        Work IQ / SharePoint MCP e incolla Client ID e Secret in Hub. Esegui anche il provisioning
        tenant Work IQ (script Enable-WorkIQToolsForTenant.ps1) se richiesto dall'admin Microsoft 365.
      scopes:
        - openid
        - profile
        - offline_access
    official_doc_url: https://learn.microsoft.com/en-us/microsoft-agent-365/
    registry_search_hint: sharepoint mcp microsoft
    approval_status: preview

