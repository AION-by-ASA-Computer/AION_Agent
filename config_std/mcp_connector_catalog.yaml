  # --- Stdio / locale (community) ---------------------------------------------

  - id: email_imap
    title: Email (IMAP / SMTP)
    category: productivity
    install_type: stdio
    description: >
      Server MCP IMAP/SMTP (es. gabigabogabu/email-mcp-server via Bun). Ogni utente configura
      credenziali in chat-ui; il processo legge EMAIL_USER, EMAIL_PASSWORD, IMAP_* e SMTP_*.
    tags: [email, imap, smtp]
    mcp_name_hints: [email_imap, email-mcp-server, imap-mcp, imap-smtp, imap_smtp, gabigabogabu]
    integration_hints:
      - id: n8n
        label_it: n8n
        note_it: >
          Credenziali IMAP spesso già definite in n8n: copia host, utente e password/app-password
          nei campi sotto (EMAIL_USER = indirizzo, EMAIL_PASSWORD = app password).
    credential_fields:
      - { key: EMAIL_USER, label: "Indirizzo email (env EMAIL_USER)", secret: false, required: true }
      - { key: EMAIL_PASSWORD, label: "Password / app password (env EMAIL_PASSWORD)", secret: true, required: true }
      - { key: IMAP_HOST, label: "Server IMAP (env IMAP_HOST)", secret: false, required: true }
      - { key: IMAP_PORT, label: "Porta IMAP (env IMAP_PORT, es. 993)", secret: false, required: true }
      - { key: SMTP_HOST, label: "Server SMTP (env SMTP_HOST)", secret: false, required: true }
      - { key: SMTP_PORT, label: "Porta SMTP (env SMTP_PORT, es. 465)", secret: false, required: true }
    official_doc_url: https://github.com/gabigabogabu/email-mcp-server
    mcp_upstream_docs_url: https://github.com/gabigabogabu/email-mcp-server/blob/main/README.md
    registry_search_hint: imap email mcp gabigabogabu
    required_env:
      - EMAIL_USER
      - EMAIL_PASSWORD
      - IMAP_HOST
      - IMAP_PORT
      - SMTP_HOST
      - SMTP_PORT
    optional_env: []
    approval_status: aion_recommended
    example_registry_block: |
      # email-mcp-server (Bun/TS, per_user):
      #   command: bun
      #   args: ["run", "mcp_servers/email-mcp-server/index.ts"]
      #   aion_connector_id: email_imap
      #   env:
      #     EMAIL_USER: "${AION_USER_EMAIL_MCP_SERVER__EMAIL_USER}"
      #     EMAIL_PASSWORD: "${AION_USER_EMAIL_MCP_SERVER__EMAIL_PASSWORD}"
      #     IMAP_HOST: "${AION_USER_EMAIL_MCP_SERVER__IMAP_HOST}"
      #     IMAP_PORT: "${AION_USER_EMAIL_MCP_SERVER__IMAP_PORT}"
      #     SMTP_HOST: "${AION_USER_EMAIL_MCP_SERVER__SMTP_HOST}"
      #     SMTP_PORT: "${AION_USER_EMAIL_MCP_SERVER__SMTP_PORT}"
