# Catalogo MCP curato (source of truth in config_std/).
# Copiato in config/ da scripts/sync_config.py; override locale: mcp_connector_catalog.local.yaml
#
# Campi per connettori remoti OAuth (allineati a Cursor, Claude Desktop, VS Code Copilot):
#   install_type: remote
#   remote_url: URL endpoint MCP hosted (HTTP/SSE/streamable)
#   auth_type: oauth2 | api-key | basic | none
#     oauth2 → OAuth in chat-ui (nessun campo PAT); etichetta da title / oauth_provider
#   oauth: (opzionale) endpoint statici quando il server non espone MCP OAuth discovery
#     authorization_server, authorization_endpoint, token_url, scopes, authorize_params
#     client_credentials_required: true → admin deve configurare client_id/secret in Hub
#     setup_doc_url: (opzionale) guida configurazione provider
#     admin_setup_hint: (opzionale) testo mostrato in Admin → MCP Hub
#   oauth_provider: (opzionale) id tecnico provider; default: id connettore
#   featured_remote: true  → mostrato in Hub marketplace e preset modal
#   remote_url_template: true → URL contiene placeholder (es. {tenant_id}); install manuale
#   default_credential_mode: per_user

version: 1
connectors:
  # --- Remote OAuth hosted (ufficiali) ----------------------------------------

  - id: notion
    title: Notion
    category: knowledge
    install_type: remote
    remote_url: https://mcp.notion.com/mcp
    auth_type: oauth2
    featured_remote: true
    default_credential_mode: per_user
    description: >
      Server MCP ufficiale Notion (hosted). OAuth PKCE per utente; pagine, database e ricerca.
      Alternativa stdio: @makenotion/notion-mcp-server con integration token.
    tags: [notion, wiki, docs, oauth]
    mcp_name_hints: [notion, makenotion]
    official_doc_url: https://developers.notion.com/docs/mcp
    mcp_upstream_docs_url: https://developers.notion.com/docs/mcp
    registry_search_hint: notion mcp remote
    approval_status: aion_recommended
    agent_guidance: |
      Usa i tool di ricerca/lista per ottenere ID pagine e database prima di create/update.
      I campi strutturati del tool hanno priorità sul Markdown libero.

