  - id: github
    title: GitHub
    category: development
    install_type: remote
    remote_url: https://api.githubcopilot.com/mcp
    auth_type: oauth2
    oauth_provider: github
    featured_remote: true
    default_credential_mode: per_user
    description: >
      Server MCP GitHub Copilot (remoto). Richiede licenza Copilot e OAuth App o GitHub App
      con client ID/secret configurati dall'amministratore in Hub. Alternativa: PAT per utente.
    tags: [github, git, oauth]
    mcp_name_hints: [github, github-copilot]
    oauth:
      authorization_server: https://github.com/login/oauth
      authorization_endpoint: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      resource: https://api.githubcopilot.com/mcp
      client_credentials_required: true
      setup_doc_url: https://github.com/github/github-mcp-server/blob/main/docs/host-integration.md
      admin_setup_hint: >
        Crea una GitHub OAuth App o GitHub App, aggiungi il redirect URI AION (sotto) come callback,
        poi incolla Client ID e Secret nei campi OAuth in Hub. Il server remoto richiede licenza GitHub Copilot.
      scopes:
        - repo
        - read:user
        - user:email
    official_doc_url: https://docs.github.com/en/copilot/how-tos/context/model-context-protocol
    registry_search_hint: github mcp copilot
    approval_status: aion_recommended

  - id: gmail
    title: Gmail (Google)
    category: productivity
    install_type: remote
    remote_url: https://gmailmcp.googleapis.com/mcp/v1
    auth_type: oauth2
    oauth_provider: google
    featured_remote: true
    default_credential_mode: per_user
    description: >
      Server MCP hosted Google per Gmail / Workspace. Richiede client OAuth Web Application
      in Google Cloud Console (redirect URI AION) configurato dall'amministratore in Hub.
    tags: [email, google, gmail, workspace, oauth]
    mcp_name_hints: [gmail, google-mail, google_mail]
    oauth:
      authorization_server: https://accounts.google.com
      authorization_endpoint: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      client_credentials_required: true
      setup_doc_url: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
      admin_setup_hint: >
        In Google Cloud: abilita Gmail API e Gmail MCP API, configura OAuth consent screen con gli scope
        indicati, crea un client OAuth Web application con redirect URI AION, poi incolla Client ID e Secret in Hub.
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/gmail.compose
      authorize_params:
        access_type: offline
        prompt: consent
    official_doc_url: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
    registry_search_hint: gmail mcp google
    approval_status: aion_recommended

