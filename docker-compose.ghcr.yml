# Deploy da immagini pre-buildate su GitHub Container Registry (GHCR).
#
# Differenza rispetto a `docker compose up --build`: il codice applicativo viene
# dall'immagine, NON dal clone git. Per ottenerlo non basta sostituire `image:`
# — il file base monta anche ./src, ./config_std e ./mcp_servers_std sopra
# l'immagine, e un bind-mount copre sempre il contenuto dell'immagine. Qui la
# lista `volumes` del backend viene percio' riscritta con `!override`, tenendo
# solo i mount di STATO (dati, config del cliente, socket).
#
# Requisiti: Docker Compose >= 2.24 (tag YAML `!override`).
#
# Sandbox image NON pubblicata — build locale quando serve:
#   docker compose --profile sandbox-build build sandbox
#
# Uso:
#   cp .env.example .env
#   ./scripts/setup-aion-env.sh --docker
#   AION_VERSION=1.4.0 docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   AION_VERSION=1.4.0 docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d --no-build
#
# `--no-build` e' obbligatorio: la sezione `build:` del file base non e'
# rimovibile da un override, quindi senza quel flag Compose ricostruirebbe
# l'immagine dal sorgente locale quando non la trova in cache.
#
# In produzione pinnare sempre AION_VERSION a una release esatta (`latest` e'
# accettabile solo per dev/staging). Vedi docs/opensource/releases.md.

name: aion-agent

services:
  backend:
    image: ghcr.io/aion-by-asa-computer/aion-backend:${AION_VERSION:-latest}
    # Solo stato: src/, config_std/, mcp_servers_std/ e requirements-sandbox-skills.txt
    # arrivano dall'immagine.
    volumes: !override
      - aion_data:/app/data
      # Il container legge il .env dell'host (runtime.env tiene gli override admin)
      - ./.env:/app/.env:ro
      # Sessioni visibili all'host: servono a Podman rootless per i bind-mount per-chat
      - ./data/sessions:/app/data/sessions
      - ./data/db_test:/app/data/db_test
      - ~/.wren:/app/data/wren/.wren:ro
      - ${AION_PODMAN_SOCKET_HOST:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
      # Overlay scrivibili: personalizzazioni del cliente (profili, skill, registry MCP).
      # Sincronizzati da *_std al boot dell'entrypoint, con preservazione dei file modificati.
      - ./config:/app/config
      - ./mcp_servers:/app/mcp_servers

  chat-ui:
    image: ghcr.io/aion-by-asa-computer/aion-chat-ui:${AION_VERSION:-latest}

  admin-ui:
    image: ghcr.io/aion-by-asa-computer/aion-admin-ui:${AION_VERSION:-latest}

  website:
    image: ghcr.io/aion-by-asa-computer/aion-website:${AION_VERSION:-latest}
