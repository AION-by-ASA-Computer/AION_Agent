# AION Agent — GHCR standalone stack
#
# Deploy multi-tenant: 1 record DNS A + .env con DOMAIN + `docker compose -f docker-compose.ghcr.yml up -d`.
# Caddy gestisce TLS automaticamente via Let's Encrypt (richiede porte 80/443 pubbliche).
#
# Utilizza le immagini pre-compilate da GHCR (GitHub Container Registry).
# Il solo servizio sandbox viene compilato localmente (profilo `sandbox-build`).
#
# Variabili principali (vedi .env.example):
#   DOMAIN, LETS_ENCRYPT_EMAIL, AION_API_URL, AION_MODEL, secrets vari.
#
# Avvio:           docker compose -f docker-compose.ghcr.yml up -d
# Stop:            docker compose -f docker-compose.ghcr.yml down
#
name: aion-agent

x-aion-env: &aion-env
  env_file:
    - .env

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # Porte host configurabili in .env (es. 8066/44366 se 80/443 sono occupate)
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      # DOMAIN non impostato -> ":80" (modalita' local HTTP, accesso via http://localhost)
      # Per prod con TLS auto: DOMAIN=cliente.example.com nel .env
      DOMAIN: http://${DOMAIN:-:80}
      LETS_ENCRYPT_EMAIL: ${LETS_ENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ aion_net ]
    depends_on:
      backend:
        condition: service_healthy
      chat-ui: { condition: service_started }
      admin-ui: { condition: service_started }
      website: { condition: service_started }

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13-slim}
    image: aion/sandbox:${AION_SANDBOX_IMAGE_TAG:-latest}
    profiles: ["sandbox-build"]

  backend:
    image: ghcr.io/aion-by-asa-computer/aion-backend:${AION_VERSION:-latest}
    restart: unless-stopped
    <<: *aion-env
    environment:
      AION_API_HOST: 0.0.0.0
      AION_API_PORT: "8001"
      AION_DATA_DIR: /app/data
      # Sync config_std/ + mcp_servers_std/ -> runtime dirs at container start
      AION_SYNC_ON_BOOT: ${AION_SYNC_ON_BOOT:-1}
      # Writable MCP registry overlay (mcp_registry.yaml in config/ stays from sync)
      AION_MCP_REGISTRY_LOCAL_PATH: ${AION_MCP_REGISTRY_LOCAL_PATH:-/app/data/mcp_registry.local.yaml}
      AION_REDIS_URL: ${AION_REDIS_URL:-redis://redis:6379/0}
      AION_DB_URL: ${AION_DB_URL:-sqlite+aiosqlite:///data/aion.db}
      # Local default (DOMAIN non valorizzato): http://localhost via Caddy su :80.
      # In prod sovrascrivere nel .env: AION_PUBLIC_API_URL=https://${DOMAIN}/api
      AION_PUBLIC_API_URL: ${AION_PUBLIC_API_URL:-http://localhost/api}
      # OAuth callback base (browser-facing). Defaults to AION_PUBLIC_API_URL when absolute.
      AION_OAUTH_REDIRECT_BASE_URL: ${AION_OAUTH_REDIRECT_BASE_URL:-${AION_PUBLIC_API_URL:-http://localhost/api}}
      AION_CORS_ORIGINS: ${AION_CORS_ORIGINS:-*}
      # Root path per il reverse proxy: Caddy strippa /api, root_path glielo
      # restituisce per generare URL corretti nello schema OpenAPI / Swagger UI.
      AION_ROOT_PATH: /api
      # Docs API disabilitati in produzione (security hardening by default).
      AION_API_DOCS_ENABLED: "0"
      AION_NORTHWIND_DB_URL: /app/data/db_test
      # Session sandbox container isolation (Podman rootless on host)
      AION_SANDBOX_BACKEND: ${AION_SANDBOX_BACKEND:-container}
      AION_CONTAINER_RUNTIME: ${AION_CONTAINER_RUNTIME:-podman}
      AION_SANDBOX_CONTAINER_IMAGE: ${AION_SANDBOX_CONTAINER_IMAGE:-aion/sandbox:latest}
      AION_PODMAN_SOCKET: /run/podman/podman.sock
      CONTAINER_HOST: unix:///run/podman/podman.sock
      AION_SANDBOX_FAIL_CLOSED: ${AION_SANDBOX_FAIL_CLOSED:-1}
      AION_SANDBOX_MCP_JAIL: ${AION_SANDBOX_MCP_JAIL:-1}
      AION_LONG_RUN_ENABLED: ${AION_LONG_RUN_ENABLED:-0}
      # Absolute host path to data/ (required for Podman session bind-mounts + live src overlay)
      AION_SANDBOX_HOST_DATA_DIR: ${AION_SANDBOX_HOST_DATA_DIR}
    volumes:
      - aion_data:/app/data
      - ./.env:/app/.env:ro
      - ./data/sessions:/app/data/sessions
      - ./data/db_test:/app/data/db_test
      - ${AION_PODMAN_SOCKET_HOST:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
      # Writable runtime overlay (synced from the image's *_std at boot;
      # local customizations persist across upgrades).
      - ./config:/app/config
      - ./mcp_servers:/app/mcp_servers
    expose:
      - "8001"
    networks: [ aion_net ]
    extra_hosts:
      - "contractai-db:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    depends_on:
      redis:
        condition: service_healthy

  chat-ui:
    image: ghcr.io/aion-by-asa-computer/aion-chat-ui:${AION_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "8003"
    networks: [ aion_net ]

  admin-ui:
    image: ghcr.io/aion-by-asa-computer/aion-admin-ui:${AION_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3870"
    networks: [ aion_net ]

  website:
    image: ghcr.io/aion-by-asa-computer/aion-website:${AION_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    networks: [ aion_net ]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks: [ aion_net ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Sidecar che applica gli aggiornamenti richiesti dall'admin-ui (pulsante
  # "Aggiorna ora"): esegue `install.sh upgrade` sullo stack tramite il socket
  # Docker. Docs: docs/deployment/self-update.md
  #
  # Sicurezza: /var/run/docker.sock equivale a root sull'host. Il servizio non
  # pubblica porte (solo aion_net), accetta solo richieste con
  # AION_UPDATER_TOKEN ed esegue un unico comando. Si disattiva togliendo
  # "updater" da COMPOSE_PROFILES nel .env.
  #
  # Le chiavi AION_HOST_* sono scritte da install.sh (_ensure_updater_env); i
  # default servono solo a rendere valido il file quando il profilo è spento.
  updater:
    image: ghcr.io/aion-by-asa-computer/aion-updater:${AION_VERSION:-latest}
    profiles: ["updater"]
    restart: unless-stopped
    init: true
    # Hostname fisso: install.sh lo scrive nel lock data/.upgrade.lock e lo usa
    # per riconoscere i lock lasciati da un'istanza precedente dell'updater.
    hostname: aion-updater
    # UID/GID dell'utente di deploy: i file scritti (.env, data/, backup)
    # restano suoi; il GID del socket Docker dà accesso al daemon.
    user: "${AION_HOST_UID:-1000}:${AION_HOST_GID:-1000}"
    group_add:
      - "${AION_HOST_DOCKER_GID:-0}"
    # Stesso path dell'host: install.sh usa $PWD nei `docker run -v` e compose
    # risolve i path relativi rispetto a questa directory.
    working_dir: ${AION_HOST_INSTALL_DIR:-/nonexistent}
    environment:
      AION_UPDATER_TOKEN: ${AION_UPDATER_TOKEN:-}
      AION_HOST_INSTALL_DIR: ${AION_HOST_INSTALL_DIR:-/nonexistent}
      # compose espande `~` nei path dei volumi con l'HOME del client: la
      # allineiamo a quella dell'host così l'updater risolve i path come un
      # `docker compose` lanciato a mano (anche negli override locali).
      HOME: ${AION_HOST_HOME:-/tmp}
      # `localhost` qui non è l'host: health check diretto sul backend.
      AION_UPGRADE_HEALTH_URL: http://backend:8001/health
      # Sandbox: pull dell'immagine via API compatibile Docker del socket Podman.
      AION_PODMAN_REMOTE: "1"
      AION_PODMAN_SOCKET: /run/podman/podman.sock
      # Immagine in esecuzione: usata per l'helper che ricrea l'updater a fine upgrade.
      AION_UPDATER_SELF_IMAGE: ghcr.io/aion-by-asa-computer/aion-updater:${AION_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AION_HOST_INSTALL_DIR:-/nonexistent}:${AION_HOST_INSTALL_DIR:-/nonexistent}
      - ${AION_PODMAN_SOCKET_HOST:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
      # Modalità ibrida (build locali): clone del repository allo stesso path,
      # contesto delle build dell'hop finale "local". Senza AION_LOCAL_REPO_DIR
      # viene montata una directory innocua (scripts/) in un path inutilizzato.
      - ${AION_LOCAL_REPO_DIR:-./scripts}:${AION_LOCAL_REPO_DIR:-/opt/aion-updater/no-local-repo}:ro
    expose:
      - "8090"
    networks: [ aion_net ]

networks:
  aion_net:
    driver: bridge

volumes:
  aion_data:
  caddy_data:
  caddy_config:
  redis_data:
