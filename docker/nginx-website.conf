# Static server for the Docusaurus documentation site (container "website").
#
# The site is built with baseUrl=/docs/ and docs routeBasePath='/', so every
# public URL starts with /docs/ (https://host/docs/, https://host/docs/api-guide/overview,
# https://host/docs/assets/...). The files in the build folder do NOT carry the
# /docs/ prefix (build/index.html, build/api-guide/overview/index.html,
# build/assets/...), so the /docs/ location below aliases the prefix to the
# web root. Caddy forwards /docs* here without stripping the prefix
# (see docker/Caddyfile).
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects must stay relative: nginx only sees its internal port (3000),
    # while the browser talks to Caddy on the public domain.
    absolute_redirect off;

    # Hashed JS/CSS bundles and images never change for a given URL: cache long.
    location ^~ /docs/assets/ {
        alias /usr/share/nginx/html/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # /docs (no trailing slash) -> /docs/ so relative assets resolve.
    location = /docs {
        return 301 /docs/;
    }

    # Every page: /docs/<route> -> <route>/index.html (or <route>.html), served
    # directly (no "add a trailing slash" redirect).
    location ^~ /docs/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    error_page 404 /docs/404.html;
}
